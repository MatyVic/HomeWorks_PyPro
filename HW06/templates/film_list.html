<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>{{ gnr_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>
<body>
    <div class="form-wrapper">
        <button class="toggle-btn" onclick="toggleForm()">➕ Додати фільм</button>

        <div id="add-form" class="form-container" style="display:none;">
            <form method="POST" enctype="multipart/form-data">
                <h2>Додати фільм</h2>
                <input type="text" name="film_name" placeholder="Введіть фільм" required>
                <input type="text" name="director_name" placeholder="Режисер" required>
                <input type="text" name="cast_text" placeholder="У ролях" required>
                <input type="text" name="discrp_text" placeholder="Опис фільму" required>
                <input type="file" name="poster" accept="image/*" required>
                <input type="date" name="whatch_date" placeholder="Дата перегляду" required>

                <label for="rating">Оцінка:</label>
                <select name="rating" id="rating" required>
                    <option value="1">1 ⭐</option>
                    <option value="2">2 ⭐⭐</option>
                    <option value="3">3 ⭐⭐⭐</option>
                    <option value="4">4 ⭐⭐⭐⭐</option>
                    <option value="5">5 ⭐⭐⭐⭐⭐</option>
                </select>
                <button type="submit">Зберегти</button>
            </form>
        </div>
    </div>
    <h3>Переглянуті фільми у жанрі {{ gnr_name }}</h3>
    <div class="list-container">
        <ul class="film-list">
            {% for film in flm_lst %}
                <li class="film-item">
                    <a href="/genres/{{ gnr_name }}/{{ loop.index }}">
                        <img src="{{ url_for('static', filename='posters/' ~ film.poster) }}"
                             alt="Постер {{ film.film }}" class="film-thumb">
                        <span class="film-title">{{ film.film }}</span>
                        <span class="film-rating">{{ film.rating }} ⭐</span>
                    </a>
                </li>
            {% endfor %}
        </ul>
    </div>

    <footer class="site-footer">
        <div class="footer-text">
           © 2026 Мій сайт. Усі права захищені.
        </div>
        <div class="footer-links">
            <a href="{{ url_for('about') }}">Про сайт</a>
        </div>
    </footer>

    <script>
        function toggleForm() {
            const form = document.getElementById("add-form");
            form.style.display = (form.style.display === "none" || form.style.display === "") ? "block" : "none";
        }
    </script>
</body>
</html>
